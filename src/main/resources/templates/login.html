<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="login-container" th:style="|background-image: url('@{/images/fondo.jpg}');|">
    <div class="login-box">
        <h2>Iniciar Sesión</h2>

        <!-- FORMULARIO JWT -->
        <form id="jwtLoginForm">
            <!-- Campo de correo -->
            <div class="input-box">
                <input type="email" id="email" placeholder="Correo Electrónico" required>
                <span class="icon-user"><i class="fas fa-user"></i></span>
                <p class="error-message" id="emailError"></p>
            </div>

            <!-- Campo de contraseña -->
            <div class="input-box">
                <input type="password" id="password" placeholder="Contraseña" required>
                <span id="togglePassword" class="icon-eye"><i class="fas fa-eye-slash"></i></span>
                <p class="error-message" id="passwordError"></p>
            </div>

            <button type="submit">Iniciar Sesión</button>

            <!-- Mensaje de error -->
            <div class="error-message" id="generalError" style="display: none;">
                <p>Usuario o contraseña incorrectos. Inténtalo de nuevo.</p>
            </div>
        </form>

        <div class="register-link">
            <p>¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
        </div>
    </div>
</div>

<!-- Script para enviar la solicitud JWT -->
<script>
    document.getElementById("jwtLoginForm").addEventListener("submit", function (event) {
        event.preventDefault(); // evitar recarga

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        fetch("http://localhost:8080/api/jwt/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include", // ✅ permite guardar la cookie
            body: JSON.stringify({ email, password })
        })
            .then(response => {
                if (response.ok) {
                    window.location.href = "/"; // Redirige al home
                } else {
                    document.getElementById("generalError").style.display = "block";
                }
            })
            .catch(error => {
                console.error("Error en login:", error);
                document.getElementById("generalError").style.display = "block";
            });
    });
</script>

<script th:src="@{/js/animations.js}"></script>
</body>
</html>
